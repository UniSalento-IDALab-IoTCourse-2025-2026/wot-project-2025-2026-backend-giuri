# Listener MQTT in chiaro — SOLO debug locale, da rimuovere in produzione
listener 1883
allow_anonymous true

# Listener MQTT con TLS (client nativi: paho-mqtt, app paziente, subscriber)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous true

# Listener WebSocket con TLS (dashboard browser)
listener 9002
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all